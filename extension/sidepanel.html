<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Resume Tailor</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="top">
    <h1>Resume Tailor</h1>
    <span class="spacer"></span>
    <span class="pill" id="diag">LLM: checking…</span>
    <span class="pill" id="embDiag">Emb: idle</span>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="result">Result</div>
    <div class="tab" data-tab="history">History</div>
    <div class="tab" data-tab="variants">Variants</div>
  </div>

  <section class="panel active" id="panel-result">
    <div class="card">
      <h2>Job description</h2>
      <div class="source-row">
        <label><input type="radio" name="jdSource" value="scrape" checked> Scrape active tab</label>
        <label><input type="radio" name="jdSource" value="manual"> Paste manually</label>
      </div>
      <div id="manualBlock" hidden>
        <textarea id="jd" rows="6" placeholder="Paste a JD here…"></textarea>
        <div class="field-group">
          <label class="field" style="margin:0">Sample</label>
          <select id="sampleJd"><option value="">— pick one —</option></select>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="tailorBtn" title="Match variant, check qualifications, fit gap, and rewrite bullets">Analyze &amp; tailor</button>
        <button id="matchBtn" title="Only match and show fit gap — no rewrite">Check fit only</button>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="overrideQualBtn"> Override qual block</label>
        <label><input type="checkbox" id="forceRewriteBtn"> Force rewrite</label>
      </div>
      <div class="timings" id="timings"></div>
    </div>

    <section id="status"></section>

    <div class="card" id="matchCard" hidden>
      <h2>Match &amp; qualification</h2>
      <div class="match-line">
        Matched <strong id="variantLabel">—</strong>
        <span id="confidence" class="kw present"></span>
      </div>
      <div class="scores" id="scores"></div>
      <div id="qualBanner"></div>
    </div>

    <div class="card" id="fitCard" hidden>
      <h2>Fit gap</h2>
      <div id="fitgap"></div>
      <div id="goodEnough"></div>
    </div>

    <div class="card" id="diffCard" hidden>
      <h2>Bullet diff <span class="muted-note">— click right column to edit</span></h2>
      <div class="legend">
        Added words:
        <span class="diff-add prov-original">from original</span>
        <span class="diff-add prov-jd">from JD keyword</span>
        <span class="diff-add prov-model">model-introduced</span>
      </div>
      <div id="diff"></div>
      <div class="actions">
        <button class="primary" id="previewBtn" title="Open the tailored resume rendered as a real document in a new tab">Preview</button>
        <button id="copyBtn" title="Copy the tailored resume text to clipboard">Copy text</button>
        <button id="docxBtn" title="Download as a Word .docx with formatting">Download .docx</button>
        <button id="saveBtn" title="Save this application to history">Save to history</button>
      </div>
    </div>
  </section>

  <section class="panel" id="panel-history">
    <div class="card">
      <div class="actions"><button id="clearHistBtn">Clear all</button></div>
      <div id="history"></div>
    </div>
  </section>

  <section class="panel" id="panel-variants">
    <div class="card">
      <label class="field">Variants JSON</label>
      <textarea id="variants" rows="20" spellcheck="false"></textarea>
      <div class="actions"><button class="primary" id="saveVarsBtn">Save variants</button></div>
    </div>
  </section>

  <details id="logDetails">
    <summary>Log</summary>
    <pre id="log"></pre>
  </details>

  <script src="../src/core/prompts.js"></script>
  <script src="../src/core/resume-parser.js"></script>
  <script src="../src/core/validator.js"></script>
  <script src="../src/core/diff.js"></script>
  <script src="../src/data/resumes.js"></script>
  <script src="../src/lib/history.js"></script>
  <script src="../src/lib/preview.js"></script>
  <script src="../src/models/gemini.js"></script>
  <script type="module" src="../src/models/embeddings.js"></script>
  <script type="module" src="../src/lib/docx.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
