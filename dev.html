<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Resume Tailor — Dev</title>
  <link rel="stylesheet" href="sidepanel.css" />
  <style>
    body { max-width: 900px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .badge { padding: 2px 6px; border-radius: 4px; background: #eef; font-size: 11px; }
    #log { background: #111; color: #0f0; padding: 8px; height: 120px; overflow: auto;
           font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Resume Tailor — Dev Harness <span class="badge" id="diag">checking…</span></h1>
  <p>Runs the same prompts as the side panel, but in a normal tab. Refresh = instant reload.
     No <code>chrome.*</code> APIs needed — variants and JD live in this page.</p>

  <div class="row">
    <div>
      <h2>Job description
        <select id="sampleJd">
          <option value="">— sample JDs —</option>
        </select>
      </h2>
      <textarea id="jd" rows="14" placeholder="Paste a JD here…"></textarea>
    </div>
    <div>
      <h2>Variants (JSON)</h2>
      <textarea id="variants" rows="14"></textarea>
    </div>
  </div>

  <p>
    <button id="runBtn">Run classify + rewrite</button>
    <button id="classifyBtn">Classify only</button>
    <span id="timings"></span>
  </p>

  <h3>Log</h3>
  <pre id="log"></pre>

  <h3>Result</h3>
  <p>Matched: <strong id="variantLabel">—</strong> · Keywords: <span id="keywords">—</span></p>
  <textarea id="tailored" rows="20"></textarea>

  <script src="prompts.js"></script>
  <script src="resumes.js"></script>
  <script type="module" src="model-webllm.js"></script>
  <script src="dev.js"></script>
</body>
</html>
