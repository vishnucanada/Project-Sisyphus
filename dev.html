<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Resume Tailor — Dev</title>
  <link rel="stylesheet" href="sidepanel.css" />
  <style>
    body { max-width: 1100px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .badge { padding: 2px 6px; border-radius: 4px; background: #eef; font-size: 11px; }
    #log { background: #111; color: #0f0; padding: 8px; height: 120px; overflow: auto;
           font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap; }
    .diffrow { display: grid; grid-template-columns: 24px 1fr 1fr; gap: 10px;
               border-top: 1px solid #eee; padding: 8px 0; align-items: start; }
    .diff-side { line-height: 1.5; padding: 2px 6px; border-radius: 3px; min-height: 1.4em; }
    .diff-side.left { color: #888; background: #fafafa; }
    .diff-side.right { color: #111; cursor: text; }
    .diff-side.right:hover { background: #f8fff8; }
    .diff-side textarea { width: 100%; font-family: inherit; font-size: inherit; line-height: inherit; }
    .diffhdr { display: grid; grid-template-columns: 24px 1fr 1fr; gap: 10px;
               font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 0; }
    .diffrow.rejected .right { text-decoration: line-through; opacity: 0.5; }
    .diff-same { color: #444; }
    .diff-add { background: #c8f7c8; color: #064; padding: 0 2px; border-radius: 2px; }
    .diff-del { background: #ffd0d0; color: #800; text-decoration: line-through; padding: 0 2px; border-radius: 2px; }
    .badge-flag { background: #fee; color: #900; padding: 1px 6px; border-radius: 3px; font-size: 10px; }
    .qual-banner { padding: 10px 12px; border-radius: 6px; margin: 8px 0; }
    .qual-qualified { background: #efe; color: #060; }
    .qual-stretch { background: #ffd; color: #850; }
    .qual-underqualified { background: #fee; color: #900; border: 1px solid #f88; }
    .section-title { font-weight: 600; margin: 16px 0 4px; color: #333; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    #fitgap ul { columns: 2; }
    #fitgap .missing li { color: #b00; }
    #fitgap .present li { color: #060; }
    .pill { display: inline-block; padding: 1px 6px; border-radius: 10px; background: #eef; margin: 2px; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Resume Tailor — Dev Harness
    <span class="badge" id="diag">checking…</span>
    <span class="badge" id="embDiag">emb: idle</span>
  </h1>

  <div class="row">
    <div>
      <h2>Job description
        <select id="sampleJd">
          <option value="">— sample JDs —</option>
        </select>
      </h2>
      <textarea id="jd" rows="14" placeholder="Paste a JD here…"></textarea>
    </div>
    <div>
      <h2>Variants (JSON)</h2>
      <textarea id="variants" rows="14"></textarea>
    </div>
  </div>

  <p>
    <button id="runBtn">Match + tailor</button>
    <button id="matchBtn">Match only (embeddings)</button>
    <button id="exportMdBtn">Copy markdown</button>
    <button id="exportDocxBtn">Download .docx</button>
    <label><input type="checkbox" id="overrideQualBtn"> Override qualification block</label>
    <span id="timings"></span>
  </p>

  <div id="qualBanner"></div>

  <h3>Log</h3>
  <pre id="log"></pre>

  <h3>Match
    <span id="variantLabel" class="badge">—</span>
    <span id="confidence"></span>
  </h3>
  <div id="scores"></div>

  <h3>Fit gap</h3>
  <div id="fitgap"></div>

  <h3>Bullet diff
    <small>(click ✓ to toggle accept; rejected bullets fall back to original on export)</small>
  </h3>
  <div id="diff"></div>

  <script src="prompts.js"></script>
  <script src="resume-parser.js"></script>
  <script src="validator.js"></script>
  <script src="diff.js"></script>
  <script src="resumes.js"></script>
  <script type="module" src="model-webllm.js"></script>
  <script type="module" src="model-embeddings.js"></script>
  <script type="module" src="docx-export.js"></script>
  <script src="dev.js"></script>
</body>
</html>
